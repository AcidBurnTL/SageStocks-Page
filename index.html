<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageStocks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: #1d1d1f;
            background: #fff;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 48px 24px;
        }
        h1 {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 18px;
            color: #86868b;
            margin-bottom: 48px;
        }
        .links {
            display: flex;
            gap: 24px;
            justify-content: center;
        }
        a {
            color: #0071e3;
            text-decoration: none;
            font-size: 16px;
        }
        a:hover { text-decoration: underline; }
        @media (prefers-color-scheme: dark) {
            body { background: #000; color: #f5f5f7; }
            .tagline { color: #86868b; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SageStocks</h1>
        <p class="tagline">AI-powered stock predictions</p>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
