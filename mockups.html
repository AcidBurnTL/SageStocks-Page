<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageStocks — Device Mockups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e0e10;
            --surface: #18181c;
            --border: #2a2a30;
            --text: #e8e8ed;
            --text-dim: #6e6e78;
            --green: #00d672;
            --font: 'DM Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            padding: 60px 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 60px;
        }

        .section-label {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--green);
            text-align: center;
            margin-bottom: 32px;
            margin-top: 80px;
        }

        .section-label:first-of-type { margin-top: 0; }

        /* ── MacBook Mockup ── */
        .macbook-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .macbook {
            width: 100%;
            max-width: 900px;
        }

        .macbook-screen {
            background: #000;
            border-radius: 12px 12px 0 0;
            border: 3px solid #2a2a30;
            border-bottom: none;
            overflow: hidden;
            aspect-ratio: 16 / 10;
            position: relative;
        }

        .macbook-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            transform-origin: top left;
        }

        .macbook-bottom {
            background: linear-gradient(180deg, #3a3a42 0%, #2a2a30 100%);
            height: 18px;
            border-radius: 0 0 4px 4px;
            position: relative;
        }

        .macbook-bottom::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: #1a1a1e;
            border-radius: 0 0 4px 4px;
        }

        .macbook-base {
            width: 106%;
            margin-left: -3%;
            height: 10px;
            background: linear-gradient(180deg, #3a3a42 0%, #2a2a30 100%);
            border-radius: 0 0 8px 8px;
        }

        .macbook-label {
            text-align: center;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 16px;
            letter-spacing: 1px;
        }

        /* ── iPhone Mockup ── */
        .phones-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .phone-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .iphone {
            width: 280px;
            background: #1a1a1e;
            border-radius: 40px;
            padding: 14px;
            border: 3px solid #2a2a30;
            position: relative;
        }

        .iphone::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 26px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }

        .iphone-screen {
            background: #000;
            border-radius: 28px;
            overflow: hidden;
            aspect-ratio: 9 / 19.5;
            position: relative;
        }

        .iphone-screen iframe {
            width: 375px;
            height: 812px;
            border: none;
            transform: scale(calc(252 / 375));
            transform-origin: top left;
        }

        .phone-label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 20px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            body { padding: 40px 16px; }
            .phones-row { gap: 24px; }
            .iphone { width: 240px; }
            .iphone-screen iframe {
                width: 375px;
                height: 812px;
                transform: scale(calc(212 / 375));
            }
        }

        @media (max-width: 480px) {
            .phones-row { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <h1>SageStocks — Device Previews</h1>
    <p class="subtitle">How the site looks across devices</p>

    <!-- MacBook - Landing Page -->
    <p class="section-label">MacBook — Landing Page</p>
    <div class="macbook-wrap">
        <div class="macbook">
            <div class="macbook-screen">
                <iframe src="index.html" loading="lazy"></iframe>
            </div>
            <div class="macbook-bottom"></div>
            <div class="macbook-base"></div>
            <p class="macbook-label">MacBook Pro 14"</p>
        </div>
    </div>

    <!-- MacBook - Privacy -->
    <p class="section-label">MacBook — Privacy Policy</p>
    <div class="macbook-wrap">
        <div class="macbook">
            <div class="macbook-screen">
                <iframe src="privacy.html" loading="lazy"></iframe>
            </div>
            <div class="macbook-bottom"></div>
            <div class="macbook-base"></div>
            <p class="macbook-label">MacBook Pro 14"</p>
        </div>
    </div>

    <!-- MacBook - Terms -->
    <p class="section-label">MacBook — Terms of Service</p>
    <div class="macbook-wrap">
        <div class="macbook">
            <div class="macbook-screen">
                <iframe src="terms.html" loading="lazy"></iframe>
            </div>
            <div class="macbook-bottom"></div>
            <div class="macbook-base"></div>
            <p class="macbook-label">MacBook Pro 14"</p>
        </div>
    </div>

    <!-- iPhone Row -->
    <p class="section-label">iPhone 15 Pro — All Pages</p>
    <div class="phones-row">
        <div class="phone-wrap">
            <div class="iphone">
                <div class="iphone-screen">
                    <iframe src="index.html" loading="lazy"></iframe>
                </div>
            </div>
            <p class="phone-label">Landing Page</p>
        </div>
        <div class="phone-wrap">
            <div class="iphone">
                <div class="iphone-screen">
                    <iframe src="privacy.html" loading="lazy"></iframe>
                </div>
            </div>
            <p class="phone-label">Privacy Policy</p>
        </div>
        <div class="phone-wrap">
            <div class="iphone">
                <div class="iphone-screen">
                    <iframe src="terms.html" loading="lazy"></iframe>
                </div>
            </div>
            <p class="phone-label">Terms of Service</p>
        </div>
    </div>

</body>
</html>
